<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Japones App</title>

<style>
body { font-family: Arial; text-align: center; background: #f2f2f2; }
.card {
    background: white;
    padding: 20px;
    margin: 20px auto;
    width: 340px;
    border-radius: 10px;
}
.word { font-size: 32px; }
.hidden { display: none; }
button { margin: 5px; padding: 10px; }
.menu button { margin: 5px; }
</style>
</head>

<body>

<h2>App Japonés</h2>

<div class="menu">
    <button onclick="setModo('kanji')">Kanji</button>
    <button onclick="setModo('verbos')">Verbos</button>
    <button onclick="setModo('adj_i')">Adj-i</button>
    <button onclick="setModo('adj_na')">Adj-na</button>
    <button onclick="setModo('gram_dic')">Diccionario</button>
    <button onclick="setModo('gram_te')">Forma て</button>
    <button onclick="setModo('gram_nai')">Forma ない</button>
</div>

<div class="card">
    <div class="word" id="word"></div>

    <div id="info" class="hidden">
        <p id="reading"></p>
        <p id="meaning"></p>
        <p id="extra"></p>
    </div>

    <button onclick="mostrar()">Mostrar</button><br>
    <button onclick="next()">✅</button>
    <button onclick="next()">❌</button>
</div>

<script>

// ================= KANJI =================
const kanji = [
{w:"日本",r:"にほん",m:"Japón"},
{w:"毎日",r:"まいにち",m:"Todos los días"},
{w:"学生",r:"がくせい",m:"Estudiante"},
{w:"先生",r:"せんせい",m:"Profesor"},
{w:"時間",r:"じかん",m:"Tiempo"},
{w:"今日",r:"きょう",m:"Hoy"},
{w:"明日",r:"あした",m:"Mañana"},
{w:"友達",r:"ともだち",m:"Amigo"},
{w:"会社",r:"かいしゃ",m:"Empresa"},
{w:"電車",r:"でんしゃ",m:"Tren"},

{w:"山",r:"やま",m:"Montaña"},
{w:"川",r:"かわ",m:"Río"},
{w:"人",r:"ひと",m:"Persona"},
{w:"水",r:"みず",m:"Agua"},
{w:"火",r:"ひ",m:"Fuego"},
{w:"木",r:"き",m:"Árbol"},
{w:"金",r:"かね",m:"Dinero"},
{w:"土",r:"つち",m:"Tierra"},
{w:"空",r:"そら",m:"Cielo"},
{w:"雨",r:"あめ",m:"Lluvia"},

{w:"駅",r:"えき",m:"Estación"},
{w:"店",r:"みせ",m:"Tienda"},
{w:"本",r:"ほん",m:"Libro"},
{w:"車",r:"くるま",m:"Auto"},
{w:"道",r:"みち",m:"Camino"},
{w:"家",r:"いえ",m:"Casa"},
{w:"国",r:"くに",m:"País"},
{w:"話",r:"はなし",m:"Historia"},
{w:"食",r:"しょく",m:"Comida"},
{w:"飲",r:"いん",m:"Beber"}
];

// ================= VERBOS =================
const verbos = [
{w:"食べる",r:"たべる",m:"Comer"},
{w:"飲む",r:"のむ",m:"Beber"},
{w:"行く",r:"いく",m:"Ir"},
{w:"来る",r:"くる",m:"Venir"},
{w:"見る",r:"みる",m:"Ver"},
{w:"聞く",r:"きく",m:"Escuchar"},
{w:"話す",r:"はなす",m:"Hablar"},
{w:"読む",r:"よむ",m:"Leer"},
{w:"書く",r:"かく",m:"Escribir"},
{w:"寝る",r:"ねる",m:"Dormir"},

{w:"起きる",r:"おきる",m:"Levantarse"},
{w:"買う",r:"かう",m:"Comprar"},
{w:"売る",r:"うる",m:"Vender"},
{w:"待つ",r:"まつ",m:"Esperar"},
{w:"持つ",r:"もつ",m:"Tener"},
{w:"使う",r:"つかう",m:"Usar"},
{w:"作る",r:"つくる",m:"Crear"},
{w:"遊ぶ",r:"あそぶ",m:"Jugar"},
{w:"泳ぐ",r:"およぐ",m:"Nadar"},
{w:"歩く",r:"あるく",m:"Caminar"},

{w:"走る",r:"はしる",m:"Correr"},
{w:"入る",r:"はいる",m:"Entrar"},
{w:"出る",r:"でる",m:"Salir"},
{w:"会う",r:"あう",m:"Encontrarse"},
{w:"開く",r:"あく",m:"Abrir"},
{w:"閉める",r:"しめる",m:"Cerrar"},
{w:"教える",r:"おしえる",m:"Enseñar"},
{w:"習う",r:"ならう",m:"Aprender"},
{w:"考える",r:"かんがえる",m:"Pensar"},
{w:"分かる",r:"わかる",m:"Entender"}
];

// ================= ADJETIVOS =================
const adj_i = [
{w:"大きい",r:"おおきい",m:"Grande"},
{w:"小さい",r:"ちいさい",m:"Pequeño"},
{w:"新しい",r:"あたらしい",m:"Nuevo"},
{w:"古い",r:"ふるい",m:"Viejo"},
{w:"高い",r:"たかい",m:"Caro/Alto"},
{w:"安い",r:"やすい",m:"Barato"},
{w:"暑い",r:"あつい",m:"Calor"},
{w:"寒い",r:"さむい",m:"Frío"},
{w:"早い",r:"はやい",m:"Temprano"},
{w:"遅い",r:"おそい",m:"Tarde"}
];

const adj_na = [
{w:"静か",r:"しずか",m:"Tranquilo"},
{w:"便利",r:"べんり",m:"Conveniente"},
{w:"好き",r:"すき",m:"Gustar"},
{w:"嫌い",r:"きらい",m:"No gustar"},
{w:"有名",r:"ゆうめい",m:"Famoso"},
{w:"元気",r:"げんき",m:"Energético"},
{w:"簡単",r:"かんたん",m:"Fácil"},
{w:"大変",r:"たいへん",m:"Difícil"},
{w:"暇",r:"ひま",m:"Libre"},
{w:"安全",r:"あんぜん",m:"Seguro"}
];

// ================= GRAMATICA =================
const gram_dic = [
{w:"食べます → ?",r:"たべる",m:"Forma diccionario",e:"Grupo 2: quitar ます"},
{w:"飲みます → ?",r:"のむ",m:"Forma diccionario",e:"Grupo 1 cambia terminación"}
];

const gram_te = [
{w:"食べる → ?",r:"たべて",m:"Forma て",e:"Grupo 2: reemplazar る→て"},
{w:"飲む → ?",r:"のんで",m:"Forma て",e:"む→んで"}
];

const gram_nai = [
{w:"食べる → ?",r:"たべない",m:"Forma negativa",e:"Grupo 2: る→ない"},
{w:"飲む → ?",r:"のまない",m:"Forma negativa",e:"む→まない"}
];

// ================= LOGICA =================
let modo = "kanji";

function getLista(){
    return {
        kanji, verbos, adj_i, adj_na,
        gram_dic, gram_te, gram_nai
    }[modo];
}

function setModo(m){
    modo = m;
    next();
}

function next(){
    const lista = getLista();
    const p = lista[Math.floor(Math.random()*lista.length)];

    document.getElementById("word").innerText = p.w;
    document.getElementById("reading").innerText = p.r;
    document.getElementById("meaning").innerText = p.m;
    document.getElementById("extra").innerText = p.e || "";

    document.getElementById("info").classList.add("hidden");
}

function mostrar(){
    document.getElementById("info").classList.remove("hidden");
}

next();

</script>

</body>
</html>
